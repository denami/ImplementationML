services:

  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-default-ml
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: credit-default-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ml-service
    restart: unless-stopped